<!doctype html>
<meta charset="utf-8">
<title>MacSurf realm lifetime: successful delivery</title>
<pre id="out">starting</pre>
<script>
(function () {
  var out = document.getElementById('out');
  function note(s) { out.textContent += '\n' + s; }
  var observer = new MutationObserver(function () { note('observer-delivered'); });
  observer.observe(document.body, { childList: true });
  document.body.appendChild(document.createElement('div'));
  setTimeout(function () { note('timer-delivered'); }, 25);
  var x = new XMLHttpRequest();
  x.open('GET', 'https://macsurf.org/t.html?run=all', true);
  x.onload = function () {
    note('xhr-delivered:' + x.status);
    /* Navigation is caused by the native deferred JS callback itself. */
    location.href = 'file:///tmp/macsurf-realm-lifetime-callback-nav.html';
  };
  x.onerror = function () { note('xhr-error'); };
  x.send();
}());
</script>
