<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Test Framework Deferred Load</title>
<script>
// Mock framework core
window.XF = window.XF || {};
window.XF.Event = {
    newHandler: function(name, fn) {
        return { name: name, fn: fn, registered: true };
    }
};
</script>
<script>
// Downstream action script
try {
    window.handlerResult = window.XF.Event.newHandler("testClick", function() { return 42; });
    document.title = window.handlerResult.registered ? "PASS" : "FAIL";
} catch(e) {
    document.title = "FAIL: " + e.message;
}
</script>
</head>
<body>
<h1>Framework Deferred Execution Test</h1>
<div id="status">Testing...</div>
<script>
document.getElementById("status").textContent = document.title;
</script>
</body>
</html>
