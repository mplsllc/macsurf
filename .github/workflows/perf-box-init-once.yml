name: Trim redundant box initialization

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-box-init-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 tools/apply_perf_box_init_once.py
          git diff --check
          bash tools/retro68_check.sh browser/netsurf/content/handlers/html/box_manipulate.c || test $? -eq 2
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-box-init-once.yml tools/apply_perf_box_init_once.py
          git add browser/netsurf/content/handlers/html/box_manipulate.c
          git commit -m "perf(box): trim redundant zero initialization" -m "box_create uses talloc_zero, so stop rewriting fields that are already zero/NULL. Preserve all non-zero sentinels, defaults, style ownership, references, and caller-provided pointers. This removes dozens of stores from every DOM-to-box allocation."
          git push origin HEAD:performance
