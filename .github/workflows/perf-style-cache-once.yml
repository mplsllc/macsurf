name: Apply reconvert style-cache optimization

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-style-cache-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source changes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py
          git diff --check
          git diff --stat
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-style-cache-once.yml
          git add browser/libcss/include/libcss/select.h browser/libcss/src/select/css_select.c browser/netsurf/content/handlers/html/box_construct.c
          git commit -m "perf(reconvert): reuse recascaded styles during rebuild" -m "Reuse freshly recascaded Style-B results for stable nodes during full DOM-to-box reconstruction. New and moved nodes fall back to normal selection; the existing double-buffered full reconvert lifecycle remains unchanged."
          git push origin HEAD:performance
