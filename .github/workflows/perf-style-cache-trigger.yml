name: Run reconvert style-cache patcher

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-style-cache-trigger.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source changes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, re
          from pathlib import Path
          y = Path('.github/workflows/perf-style-cache-once.yml').read_text()
          m = re.search(r"echo '([A-Za-z0-9+/=]+)' \\| base64 -d", y)
          if not m:
              raise SystemExit('encoded patch payload not found')
          Path('/tmp/apply.py').write_bytes(base64.b64decode(m.group(1)))
          PY
          python3 /tmp/apply.py
          git diff --check
          git diff --stat
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-style-cache-once.yml .github/workflows/perf-style-cache-trigger.yml
          git add browser/libcss/include/libcss/select.h browser/libcss/src/select/css_select.c browser/netsurf/content/handlers/html/box_construct.c
          git commit -m "perf(reconvert): reuse recascaded styles during rebuild" -m "Reuse freshly recascaded Style-B results for stable nodes during full DOM-to-box reconstruction. New and moved nodes fall back to normal selection; the existing double-buffered full reconvert lifecycle remains unchanged."
          git push origin HEAD:performance
