name: Apply textarea line-lookup optimization

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-textarea-line-lookup-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 tools/apply_perf_textarea_line_lookup_once.py
          git diff --check
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-textarea-line-lookup-once.yml tools/apply_perf_textarea_line_lookup_once.py
          git add browser/netsurf/desktop/textarea.c
          git commit -m "perf(textarea): binary-search visual lines" -m "Use one upper-bound helper for caret placement, selection redraw bounds, and multiline edit reflow instead of repeatedly scanning sorted line starts from line zero."
          git pull --rebase origin performance
          git push origin HEAD:performance
