name: Apply generated-content display optimization

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-pseudo-display-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 tools/apply_perf_pseudo_display_once.py
          git diff --check
          bash tools/retro68_check.sh browser/netsurf/content/handlers/html/box_construct.c || test $? -eq 2
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-pseudo-display-once.yml tools/apply_perf_pseudo_display_once.py
          git add browser/netsurf/content/handlers/html/box_construct.c
          git commit -m "perf(box): reuse generated-content display state" -m "Identify pseudo ownership root from ctx->root_box and compute its effective display once. Remove repeated box_is_root DOM parent/type probes and the duplicate display getter during generated box creation."
          for n in 1 2 3; do
            git fetch origin performance
            git rebase origin/performance || { git rebase --abort; exit 1; }
            if git push origin HEAD:performance; then exit 0; fi
          done
          exit 1
