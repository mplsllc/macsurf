name: Remove hot flex diagnostic overhead

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-flex-diag-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 tools/apply_perf_flex_diag_once.py
          git diff --check
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-flex-diag-once.yml tools/apply_perf_flex_diag_once.py
          git add browser/netsurf/content/handlers/html/layout_flex.c
          git commit -m "perf(flex): remove hot diagnostic-only walks" -m "Drop per-call FLEXITEM logging and the first-200-call child-count walk from the default flex layout path. These probes were diagnostic-only; layout, memoization, fallback, and safety behavior are unchanged."
          git push origin HEAD:performance
