name: Apply flex allocation optimization

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-flex-alloc-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 tools/apply_perf_flex_alloc_once.py
          git diff --check
          bash tools/retro68_check.sh browser/netsurf/content/handlers/html/layout_flex.c || test $? -eq 2
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-flex-alloc-once.yml tools/apply_perf_flex_alloc_once.py
          git add browser/netsurf/content/handlers/html/layout_flex.c
          git commit -m "perf(flex): embed first line in layout context" -m "Avoid one heap allocation/free for the common single-line flex container by embedding the first flex_line_data in flex_ctx. Wrapped containers allocate only when they need a second line. Also retire the remaining per-call FLEXPHASE diagnostic block."
          git push origin HEAD:performance
