name: Apply box traversal ascent optimization

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-box-ascent-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 tools/apply_perf_box_ascent_once.py
          git diff --check
          bash tools/retro68_check.sh browser/netsurf/content/handlers/html/box_construct.c || test $? -eq 2
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-box-ascent-once.yml tools/apply_perf_box_ascent_once.py
          git add browser/netsurf/content/handlers/html/box_construct.c
          git commit -m "perf(box): collapse DOM ascent probes" -m "Use the constructed root box node for normal root tests and carry parent/next-sibling references through subtree ascent. Avoid repeated parent/type queries and the duplicate parent+sibling fetch when an ancestor sibling is found."
          for n in 1 2 3; do
            git fetch origin performance
            git rebase origin/performance || { git rebase --abort; exit 1; }
            if git push origin HEAD:performance; then exit 0; fi
          done
          exit 1
