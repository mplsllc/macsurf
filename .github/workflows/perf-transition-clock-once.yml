name: Apply lazy transition clock optimization

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-transition-clock-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 tools/apply_perf_transition_clock_once.py
          git diff --check
          bash tools/retro68_check.sh browser/netsurf/content/handlers/html/box_construct.c browser/netsurf/content/handlers/html/html.c browser/netsurf/frontends/macos9/macos9_transition.c || test $? -eq 2
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-transition-clock-once.yml tools/apply_perf_transition_clock_once.py
          git add browser/netsurf/content/handlers/html/box_construct.c browser/netsurf/content/handlers/html/html.c browser/netsurf/frontends/macos9/macos9_transition.c browser/netsurf/frontends/macos9/macos9_transition.h
          git commit -m "perf(transition): defer clock reads until effect creation" -m "Pass an explicit auto-clock sentinel from production style-change paths and resolve TickCount only after opacity differs, a matching transition descriptor exists, and duration is nonzero. Also remove the retired recascade modulo trace."
          for n in 1 2 3; do
            git fetch origin performance
            git rebase origin/performance || { git rebase --abort; exit 1; }
            if git push origin HEAD:performance; then exit 0; fi
          done
          exit 1
