name: Fix flex relayout memo key

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-flex-memo-key-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 tools/apply_perf_flex_memo_key_once.py
          git diff --check
          bash tools/retro68_check.sh browser/netsurf/content/handlers/html/layout_flex.c || test $? -eq 2
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-flex-memo-key-once.yml tools/apply_perf_flex_memo_key_once.py
          git add browser/netsurf/content/handlers/html/box.h browser/netsurf/content/handlers/html/layout_flex.c
          git commit -m "perf(flex): fix relayout memo cache key" -m "Track input available_width separately from the post-layout box width. The old cache required one field to equal both values, suppressing valid memo hits whenever the containing width differed from the resolved item width."
          git push origin HEAD:performance
