name: Apply textarea reflow optimization

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-textarea-reflow-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 tools/apply_perf_textarea_reflow_once.py
          git diff --check
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-textarea-reflow-once.yml tools/apply_perf_textarea_reflow_once.py
          git add browser/netsurf/desktop/textarea.c
          git commit -m "perf(textarea): make multiline reflow paragraph-linear" -m "Cache the next newline across soft wraps instead of rescanning the remaining paragraph for every visual line, binary-search the edited line, and remove the retired Microseconds/logging probe from every multiline reflow."
          git pull --rebase origin performance
          git push origin HEAD:performance
