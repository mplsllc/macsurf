name: Make CSS result sharing allocation-free

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-css-results-ref-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 tools/apply_perf_css_results_ref_once.py
          git diff --check
          cc -std=c89 -fsyntax-only -Ibrowser/libcss/include -Ibrowser/libwapcaplet/include -Ibrowser/libparserutils/include browser/libcss/src/select/css_select.c || true
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-css-results-ref-once.yml tools/apply_perf_css_results_ref_once.py
          git add browser/libcss/include/libcss/select.h browser/libcss/src/select/css_select.c
          git commit -m "perf(css): make select-result sharing allocation-free" -m "Refcount css_select_results wrappers so reconvert Style-B cache hits share the immutable result container directly instead of calloc'ing a duplicate and taking up to five computed-style references. Final style destruction still occurs when the last wrapper owner releases it."
          for n in 1 2 3; do
            git fetch origin performance
            git rebase origin/performance || { git rebase --abort; exit 1; }
            if git push origin HEAD:performance; then exit 0; fi
          done
          exit 1
