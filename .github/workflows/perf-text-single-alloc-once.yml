name: Make normal text construction single-allocation

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-text-single-alloc-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 tools/apply_perf_text_single_alloc_once.py
          git diff --check
          bash tools/retro68_check.sh browser/netsurf/content/handlers/html/box_construct.c || test $? -eq 2
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-text-single-alloc-once.yml tools/apply_perf_text_single_alloc_once.py
          git add browser/netsurf/content/handlers/html/box_construct.c
          git commit -m "perf(box): construct collapsed text in one allocation" -m "Collapse normal/nowrap whitespace directly into a bctx-owned talloc buffer and attach that buffer to BOX_TEXT instead of malloc-collapse, talloc-copy, and free. Preserve the generic squash algorithm and all soft-hyphen coalescing behavior."
          for n in 1 2 3; do
            git fetch origin performance
            git rebase origin/performance || { git rebase --abort; exit 1; }
            if git push origin HEAD:performance; then exit 0; fi
          done
          exit 1
