name: Remove hot grid diagnostic overhead

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-grid-diag-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 tools/apply_perf_grid_diag_once.py
          git diff --check
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-grid-diag-once.yml tools/apply_perf_grid_diag_once.py
          git add browser/netsurf/content/handlers/html/layout_grid.c
          git commit -m "perf(grid): remove hot diagnostic-only work" -m "Remove per-call grid trace bookkeeping and justify-item diagnostic calls, including an extra outer-width calculation used only for logging. Grid sizing, placement, fallback, and safety behavior are unchanged."
          git push origin HEAD:performance
