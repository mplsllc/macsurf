name: Apply ASCII font fast paths

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-font-ascii-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 tools/apply_perf_font_ascii_once.py
          git diff --check
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-font-ascii-once.yml tools/apply_perf_font_ascii_once.py
          git add browser/netsurf/frontends/macos9/macos9_font.c
          git commit -m "perf(font): fast-path ASCII measurement setup" -m "Bulk-copy ASCII runs during UTF-8 to MacRoman conversion, avoid per-codepoint conversion in font_position for ASCII, and skip CharWidth accumulation when the run uses the normal unspaced QuickDraw bulk model."
          git push origin HEAD:performance
