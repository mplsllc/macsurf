name: Apply textarea prefix-width optimization

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-textarea-prefix-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 tools/apply_perf_textarea_prefix_once.py
          git diff --check
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-textarea-prefix-once.yml tools/apply_perf_textarea_prefix_once.py
          git add browser/netsurf/desktop/textarea.c
          git commit -m "perf(textarea): cache prefix line widths" -m "Maintain the maximum visual-line width through each line so partial multiline reflow recovers the unchanged prefix extent in O(1) instead of rescanning every preceding line."
          git pull --rebase origin performance
          git push origin HEAD:performance
