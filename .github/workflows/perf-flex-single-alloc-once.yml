name: Apply flex single-allocation optimization

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-flex-single-alloc-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 tools/apply_perf_flex_single_alloc_once.py
          git diff --check
          bash tools/retro68_check.sh browser/netsurf/content/handlers/html/layout_flex.c || test $? -eq 2
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-flex-single-alloc-once.yml tools/apply_perf_flex_single_alloc_once.py
          git add browser/netsurf/content/handlers/html/layout_flex.c
          git commit -m "perf(flex): allocate context and items together" -m "Allocate flex_ctx and its flex_item_data tail in one zeroed block. Combined with the embedded first line, common single-line flex containers now need one heap allocation instead of three."
          git push origin HEAD:performance
