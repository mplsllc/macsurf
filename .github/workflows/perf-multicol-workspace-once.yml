name: Collapse multicol workspace allocations

on:
  push:
    branches: [performance]
    paths:
      - '.github/workflows/perf-multicol-workspace-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 tools/apply_perf_multicol_workspace_once.py
          git diff --check
          bash tools/retro68_check.sh browser/netsurf/content/handlers/html/layout.c || test $? -eq 2
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/perf-multicol-workspace-once.yml tools/apply_perf_multicol_workspace_once.py
          git add browser/netsurf/content/handlers/html/layout.c
          git commit -m "perf(multicol): collapse temporary allocations" -m "Replace six per-pass temporary heap allocations with one aligned workspace while preserving the existing item, height, span and segment arrays. The span flags are still explicitly zeroed and all failure cleanup remains equivalent."
          for n in 1 2 3; do
            git fetch origin performance
            git rebase origin/performance || { git rebase --abort; exit 1; }
            if git push origin HEAD:performance; then exit 0; fi
          done
          exit 1
